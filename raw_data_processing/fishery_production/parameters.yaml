year_of_interest:
 begin: 1995
 end: 2022

# FishStat country-specific begin years where the country did not exist
# or was not reported earlier. Add country-level overrides here as needed.
exceptions:
 MNE:
  begin: 2006
  end: 2022
 SRB:
  begin: 2006
  end: 2022
 SSD:
  begin: 2011
  end: 2022

# Source: FAO direct bulk download.
# Stable URL pattern at https://www.fao.org/fishery/static/Data/, with
# annual release zips going back to 2017. Bump fishstat_release here
# (and the matching src_url entries in download/main.py) when a new
# FAO edition lands - typically once per year, around April.
fishstat_release: "2026.1.0"
fishstat_aquaculture_quantity: "Aquaculture_Quantity.csv"
fishstat_capture_quantity: "Capture_Quantity.csv"
fishstat_species_groups: "CL_FI_SPECIES_GROUPS.csv"
fishstat_country_groups: "CL_FI_COUNTRY_GROUPS.csv"
fishstat_environment: "CL_FI_PRODENVIRONMENT.csv"
fishstat_waterarea: "CL_FI_WATERAREA_GROUPS.csv"

# Subdirectory under <storage_path>/data/ where the unzipped FAO bulk
# CSVs live. The download handler creates this directory.
fishstat_data_subdir: "fishstat"
